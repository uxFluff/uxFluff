<svg xmlns="http://www.w3.org/2000/svg" width="800" height="24" viewBox="0 0 800 24" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="10" width="800" height="4" fill="#4c1d95"/>
  <rect y="6" width="40" height="12" fill="#22d3ee">
    <animate attributeName="x" values="-40;800" dur="3s" repeatCount="indefinite"/>
  </rect>
  <rect y="6" width="20" height="12" fill="#f472b6">
    <animate attributeName="x" values="-20;800" dur="3s" begin="0.4s" repeatCount="indefinite"/>
  </rect>
</svg>
