<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0620"/><stop offset="1" stop-color="#4a1d8f"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="0.5" stop-color="#f472b6"/><stop offset="1" stop-color="#facc15"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="tile" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect width="60" height="60" fill="#7c3f1d"/>
      <rect width="60" height="10" fill="#4ade80"/>
      <rect y="10" width="60" height="3" fill="#166534"/>
      <path d="M0 36H60M30 13V36M0 36V60M30 36V60" stroke="#5a2d12" stroke-width="2" fill="none"/>
    </pattern>
  </defs>

  <rect width="900" height="300" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#fff">
    <circle cx="60" cy="40" r="1.5"><animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="80" r="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="30" r="2"><animate attributeName="opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="380" cy="60" r="1"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="25" r="1.5"><animate attributeName="opacity" values="1;0.2;1" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="610" cy="75" r="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="35" r="2"><animate attributeName="opacity" values="1;0.3;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="840" cy="70" r="1.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="800" cy="20" r="1"><animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="30" cy="110" r="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- shooting star -->
  <line x1="0" y1="0" x2="-40" y2="-20" stroke="#fff" stroke-width="2" stroke-linecap="round">
    <animateTransform attributeName="transform" type="translate" values="820,20;520,170" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.6;0.7;1" dur="5s" repeatCount="indefinite"/>
  </line>

  <!-- moon -->
  <circle cx="800" cy="70" r="26" fill="#fde68a"/>
  <circle cx="810" cy="62" r="22" fill="#0f0828" opacity="0.18"/>

  <!-- mountains -->
  <polygon points="0,240 80,170 160,220 260,150 380,225 500,160 620,230 740,165 860,220 900,200 900,240" fill="#1e1145"/>

  <!-- pixel cloud -->
  <g fill="#c4b5fd" opacity="0.5">
    <animateTransform attributeName="transform" type="translate" values="950,50;-150,50" dur="22s" repeatCount="indefinite"/>
    <rect x="0" y="12" width="90" height="12"/><rect x="12" y="0" width="36" height="12"/><rect x="48" y="6" width="24" height="6"/>
  </g>

  <!-- title -->
  <g text-anchor="middle" font-family="'Courier New', Courier, monospace" font-weight="bold">
    <text x="450" y="115" font-size="58" letter-spacing="8" fill="url(#title)" filter="url(#glow)">PLAYER ONE</text>
    <text x="450" y="152" font-size="16" letter-spacing="5" fill="#e9d5ff">GAME DEVELOPER  //  LVL 99</text>
    <text x="450" y="192" font-size="15" letter-spacing="4" fill="#facc15">PRESS START
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.2s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- ground (scrolling) -->
  <g>
    <rect x="0" y="240" width="960" height="60" fill="url(#tile)"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;-60,0" dur="0.5s" repeatCount="indefinite"/>
  </g>

  <!-- coins -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="950,0;-60,0" dur="8s" repeatCount="indefinite"/>
    <g fill="#facc15" stroke="#b45309" stroke-width="2">
      <ellipse cx="0" cy="215" rx="10" ry="10"><animate attributeName="rx" values="10;2;10" dur="0.9s" repeatCount="indefinite"/></ellipse>
      <ellipse cx="45" cy="215" rx="10" ry="10"><animate attributeName="rx" values="10;2;10" dur="0.9s" begin="0.15s" repeatCount="indefinite"/></ellipse>
      <ellipse cx="90" cy="215" rx="10" ry="10"><animate attributeName="rx" values="10;2;10" dur="0.9s" begin="0.3s" repeatCount="indefinite"/></ellipse>
    </g>
  </g>

  <!-- enemy slime -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="950,240;-60,240" dur="4s" repeatCount="indefinite"/>
    <path d="M-24 0 Q-24 -34 0 -34 Q24 -34 24 0 Z" fill="#a855f7" stroke="#6b21a8" stroke-width="3"/>
    <circle cx="-8" cy="-16" r="5" fill="#fff"/><circle cx="8" cy="-16" r="5" fill="#fff"/>
    <circle cx="-7" cy="-15" r="2" fill="#111"/><circle cx="9" cy="-15" r="2" fill="#111"/>
  </g>

  <!-- player (jumps over slime) -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0,0;0,0;0,-85;0,0;0,0" keyTimes="0;0.7;0.8;0.9;1" dur="4s"
      calcMode="spline" keySplines="0 0 1 1;0.2 0.6 0.4 1;0.6 0 0.8 0.4;0 0 1 1" repeatCount="indefinite"/>
    <g transform="translate(130,180)" shape-rendering="crispEdges">
      <rect x="12" y="0" width="24" height="6" fill="#ef4444"/>
      <rect x="6" y="6" width="42" height="6" fill="#ef4444"/>
      <rect x="12" y="12" width="30" height="12" fill="#fcd9b6"/>
      <rect x="30" y="14" width="6" height="6" fill="#111"/>
      <rect x="6" y="24" width="36" height="18" fill="#2563eb"/>
      <rect x="0" y="30" width="6" height="6" fill="#fcd9b6"/>
      <rect x="42" y="30" width="6" height="6" fill="#fcd9b6"/>
      <rect x="6" y="36" width="36" height="3" fill="#facc15"/>
      <rect x="12" y="42" width="12" height="12" fill="#78350f"/>
      <rect x="30" y="42" width="12" height="12" fill="#78350f"/>
      <rect x="6" y="54" width="18" height="6" fill="#1f2937"/>
      <rect x="30" y="54" width="18" height="6" fill="#1f2937"/>
    </g>
  </g>
</svg>
